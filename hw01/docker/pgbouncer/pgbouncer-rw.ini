; Пул соединений для ЗАПИСИ: все базы -> HAProxy :5000 (текущий лидер Patroni).
; Клиенты (приложение, чекер, генератор) ходят на :6432 и не знают, кто сейчас лидер.
[databases]
* = host=haproxy port=5000

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 5
; на отказ лидера соединения переустанавливаются без падения клиента
server_login_retry = 1
ignore_startup_parameters = extra_float_digits,options,application_name
log_connections = 0
log_disconnections = 0
logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
