# ============================================================================
#  Стенд ДЗ №1:  etcd x3  ->  Patroni x3 (PostgreSQL 18)  ->  HAProxy  ->  PgBouncer x2
#
#   клиент --6432--> pgbouncer-rw --> haproxy:5000 --> ЛИДЕР   (запись + чтение)
#   клиент --6433--> pgbouncer-ro --> haproxy:5001 --> РЕПЛИКИ (чтение)
#   суперпользователь (admin): напрямую в HAProxy, внешние порты 5400 (лидер) / 5401 (реплики)
#   (внутри сети docker HAProxy слушает 5000/5001; снаружи другие порты, т.к. на macOS 5000 и 7000 занимает AirPlay)
#
#  Четыре БД (crm_service_db, catalog_service_db, pos_service_db, wms_service_db) живут
#  в одном кластере; создаются при первом старте (docker/patroni/post_bootstrap.sh).
#  Меняете миграции -> docker compose down -v  (инициализация идёт один раз на пустом PGDATA).
# ============================================================================
x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.21
  restart: unless-stopped
  environment:
    ETCDCTL_API: "3"
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 5s
    timeout: 5s
    retries: 20

x-pg: &pg
  build: ./docker/patroni
  image: hw01-patroni:1
  restart: unless-stopped
  init: true                         # Patroni как не-PID1: корректно прибирает зомби и пробрасывает сигналы
  volumes:
    - ./migrations:/migrations:ro
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 20s

services:
  # ---- DCS: кворумный etcd из трёх узлов (переживает падение одного) -----------------------
  etcd1:
    <<: *etcd
    command: >
      etcd --name etcd1 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd1:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd1:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token hw01 --initial-cluster-state new
    volumes: [etcd1-data:/etcd-data]
  etcd2:
    <<: *etcd
    command: >
      etcd --name etcd2 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd2:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd2:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token hw01 --initial-cluster-state new
    volumes: [etcd2-data:/etcd-data]
  etcd3:
    <<: *etcd
    command: >
      etcd --name etcd3 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd3:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd3:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token hw01 --initial-cluster-state new
    volumes: [etcd3-data:/etcd-data]

  # ---- три узла PostgreSQL под управлением Patroni ----------------------------------------
  # pg2/pg3 стартуют после pg1: лидером первой инициализации детерминированно становится pg1
  pg1:
    <<: *pg
    hostname: pg1
    environment: {NODE_NAME: pg1, PATRONI_SCOPE: hw01-cluster}
    volumes:
      - ./migrations:/migrations:ro
      - pg1-data:/var/lib/postgresql
    ports: ["8008:8008"]
    depends_on:
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
      etcd3: {condition: service_healthy}
  pg2:
    <<: *pg
    hostname: pg2
    environment: {NODE_NAME: pg2, PATRONI_SCOPE: hw01-cluster}
    volumes:
      - ./migrations:/migrations:ro
      - pg2-data:/var/lib/postgresql
    ports: ["8009:8008"]
    depends_on:
      pg1: {condition: service_healthy}
  pg3:
    <<: *pg
    hostname: pg3
    environment: {NODE_NAME: pg3, PATRONI_SCOPE: hw01-cluster}
    volumes:
      - ./migrations:/migrations:ro
      - pg3-data:/var/lib/postgresql
    ports: ["8010:8008"]
    depends_on:
      pg1: {condition: service_healthy}

  # ---- балансировщик: лидер на :5000, реплики на :5001 ------------------------------------
  haproxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports: ["5400:5000", "5401:5001", "7070:7000"]
    depends_on:
      pg1: {condition: service_healthy}

  # ---- пул соединений -------------------------------------------------------------------
  pgbouncer-rw:
    build: ./docker/pgbouncer
    image: hw01-pgbouncer:1
    restart: unless-stopped
    command: ["/etc/pgbouncer/pgbouncer-rw.ini"]
    volumes:
      - ./docker/pgbouncer/pgbouncer-rw.ini:/etc/pgbouncer/pgbouncer-rw.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["6432:6432"]
    depends_on: [haproxy]
  pgbouncer-ro:
    build: ./docker/pgbouncer
    image: hw01-pgbouncer:1
    restart: unless-stopped
    command: ["/etc/pgbouncer/pgbouncer-ro.ini"]
    volumes:
      - ./docker/pgbouncer/pgbouncer-ro.ini:/etc/pgbouncer/pgbouncer-ro.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["6433:6433"]
    depends_on: [haproxy]

  # ---- генератор данных в контейнере (запасной путь для scripts/seed.sh; при `up -d` не стартует) ----------
  seeder:
    profiles: ["tools"]
    build: ./docker/seeder
    image: hw01-seeder:1
    entrypoint: ["python", "/app/scripts/seed.py"]
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      HW01_DB_HOST: haproxy
      HW01_DB_PORT: "5000"
    depends_on: [haproxy]

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  pg1-data:
  pg2-data:
  pg3-data:
